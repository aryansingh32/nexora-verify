name = "nexoradigitalsolutions"
compatibility_date = "2026-08-11"
compatibility_flags = ["nodejs_compat"]
no_bundle = true

# Pages Advanced Mode: point to the Worker entry generated by the build
main = ".output/server/index.mjs"

# Static assets served by Cloudflare Pages CDN
assets = { binding = "ASSETS", directory = ".output/public" }

[[rules]]
type = "ESModule"
globs = ["**/*.mjs", "**/*.js"]
